name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake   # CI no usa API keys ni genera costo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias e integración
        run: python -m pytest -q
      - name: Evaluación offline con umbrales
        run: python eval/run_eval.py --provider fake --check
